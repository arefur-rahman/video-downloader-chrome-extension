<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Universal Video Downloader</title>
        <link rel="stylesheet" href="styles.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/1dev-hridoy/1dev-hridoy@latest/buy-me-a-cha-style.css"
        />
    </head>
    <body>
        <!-- App Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"
                        />
                    </svg>
                </div>
                <span class="brand-title">Video Downloader</span>
            </div>
            <div class="server-status" id="serverStatus">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Checking...</span>
            </div>
        </header>

        <!-- Detected Video Card -->
        <div class="video-card">
            <div class="thumb-container">
                <img
                    id="videoThumb"
                    class="thumb-img"
                    src=""
                    alt="Thumbnail"
                    style="display: none"
                />
                <div id="thumbFallback" class="thumb-fallback">
                    <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                    >
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"
                        />
                    </svg>
                </div>
            </div>
            <div class="video-details">
                <div class="video-title" id="videoTitle">
                    Detecting video...
                </div>
                <div class="video-meta">
                    <span class="badge-platform" id="platformBadge"
                        >Detecting...</span
                    >
                    <span class="badge-status" id="videoStatusBadge">
                        <span class="pulse-dot"></span> Ready
                    </span>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="tab-bar">
            <button class="tab-btn active" data-tab="videoTab">
                <span>🎬</span> Video
            </button>
            <button class="tab-btn" data-tab="audioTab">
                <span>🎵</span> Audio
            </button>
        </nav>

        <!-- Video Tab Panel -->
        <div id="videoTab" class="tab-panel active">
            <div class="section-label">Select Resolution</div>
            <div class="option-grid" id="resolutionGrid">
                <button class="chip-btn selected" data-quality="1080">
                    1080p <span class="chip-badge">HD</span>
                </button>
                <button class="chip-btn" data-quality="720">720p</button>
                <button class="chip-btn" data-quality="480">480p</button>
                <button class="chip-btn" data-quality="360">360p</button>
            </div>

            <div class="form-group">
                <label class="form-label" for="videoModeSelect"
                    >Download Mode</label
                >
                <select id="videoModeSelect" class="custom-select">
                    <option value="auto" selected>
                        Video + Audio (Standard)
                    </option>
                    <option value="mute">Mute (Video Only)</option>
                </select>
            </div>
        </div>

        <!-- Audio Tab Panel -->
        <div id="audioTab" class="tab-panel">
            <div class="section-label">Audio Format</div>
            <div class="option-grid">
                <button class="chip-btn selected" data-format="mp3">MP3</button>
                <button class="chip-btn" data-format="wav">WAV</button>
                <button class="chip-btn" data-format="opus">OPUS</button>
                <button class="chip-btn" data-format="ogg">OGG</button>
            </div>

            <div class="form-group">
                <label class="form-label" for="audioBitrateSelect"
                    >Audio Bitrate</label
                >
                <select id="audioBitrateSelect" class="custom-select">
                    <option value="320">320 kbps (High Quality)</option>
                    <option value="128" selected>128 kbps (Standard)</option>
                    <option value="64">64 kbps (Compact)</option>
                </select>
            </div>
        </div>

        <!-- Live Progress Box -->
        <div id="progressBox" class="progress-box">
            <div class="progress-header">
                <span>Downloading Media</span>
                <span id="progressPercent" class="progress-percent">0%</span>
            </div>
            <div class="progress-bar-track">
                <div id="progressBarFill" class="progress-bar-fill"></div>
            </div>
            <div class="progress-actions">
                <span id="progressDetailText" class="progress-detail"
                    >Preparing engine...</span
                >
                <button id="cancelBtn" class="btn-cancel">
                    <svg
                        width="12"
                        height="12"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                    >
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                        />
                    </svg>
                    Cancel
                </button>
            </div>
        </div>

        <!-- Main Action Button -->
        <button id="downloadBtn" class="btn-download">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">Download Video</span>
        </button>

        <!-- Error Banner -->
        <div id="errorBanner" class="banner banner-error">
            <div class="banner-error-header">
                <span>Download Error</span>
                <span
                    id="errorCodeBadge"
                    style="
                        font-size: 9px;
                        background: rgba(0, 0, 0, 0.3);
                        padding: 1px 4px;
                        border-radius: 3px;
                    "
                ></span>
            </div>
            <div id="errorText">
                An error occurred while processing download.
            </div>
        </div>

        <!-- Success Banner -->
        <div id="successBanner" class="banner banner-success">
            🚀 Download started successfully! Check your downloads manager.
        </div>
        <div class="footer">
            <div class="footer-brand">
                <p>Developed by LOS</p>
            </div>
            <div class="donation-container">
                <a
                    href="https://chabondhu.com/aref"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="footer-link"
                    title="Buy me a Chai"
                    ><svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-cup"
                    >
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M5 11h14v-3h-14l0 3" />
                        <path d="M17.5 11l-1.5 10h-8l-1.5 -10" />
                        <path d="M6 8v-1a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v1" />
                        <path d="M15 5v-2" />
                    </svg>
                </a>
                <a
                    href="https://github.com/arefur-rahman"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="footer-link"
                    title="GitHub"
                    ><svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-brand-github"
                    >
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path
                            d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5"
                        />
                    </svg>
                </a>
                <a
                    href="https://www.facebook.com/aref.LoS"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="footer-link"
                    title="Facebook"
                    ><svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-brand-facebook"
                    >
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path
                            d="M7 10v4h3v7h4v-7h3l1 -4h-4v-2a1 1 0 0 1 1 -1h3v-4h-3a5 5 0 0 0 -5 5v2h-3"
                        />
                    </svg>
                </a>
                <a
                    href="https://www.linkedin.com/in/md-arefur-rahman-khan-74188232b/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="footer-link"
                    title="Linkedin"
                    ><svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-brand-linkedin"
                    >
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M8 11v5" />
                        <path d="M8 8v.01" />
                        <path d="M12 16v-5" />
                        <path d="M16 16v-3a2 2 0 1 0 -4 0" />
                        <path
                            d="M3 7a4 4 0 0 1 4 -4h10a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-10a4 4 0 0 1 -4 -4l0 -10"
                        />
                    </svg>
                </a>
                <a
                    href="https://arefolio.vercel.app/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="footer-link"
                    title="Portfolio"
                    ><svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-world"
                    >
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" />
                        <path d="M3.6 9h16.8" />
                        <path d="M3.6 15h16.8" />
                        <path d="M11.5 3a17 17 0 0 0 0 18" />
                        <path d="M12.5 3a17 17 0 0 1 0 18" />
                    </svg>
                </a>
            </div>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
